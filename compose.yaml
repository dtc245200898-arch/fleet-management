services:
  fleet:
    build:
      context: .
      dockerfile: Dockerfile
    image: fleet-management:local
    container_name: fleet-management
    restart: unless-stopped
    init: true
    ports:
      - "${FLEET_PORT:-8000}:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      FLEET_DB_PATH: /data/fleet.db
      FLEET_LOG_PATH: /logs/fleet.log
    volumes:
      - fleet_data:/data
      - fleet_logs:/logs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: fleet-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      fleet:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:9090/-/healthy
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  loki:
    image: grafana/loki:3.5.0
    container_name: fleet-loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/config.yml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:3100/ready
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  promtail:
    image: grafana/promtail:3.5.0
    container_name: fleet-promtail
    restart: unless-stopped
    command:
      - -config.file=/etc/promtail/config.yml
    ports:
      - "127.0.0.1:9080:9080"
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
      - fleet_logs:/var/log/fleet:ro
      - promtail_positions:/tmp
    depends_on:
      fleet:
        condition: service_healthy
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.3.0
    container_name: fleet-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: dtc245000898@ictu.edu.vn
      GF_SECURITY_ADMIN_EMAIL: dtc245000898@ictu.edu.vn
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/fleet-datasources.yml:ro
      - ./monitoring/grafana/provisioning/dashboards/fleet.yml:/etc/grafana/provisioning/dashboards/fleet.yml:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:3000/api/health || exit 1
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  fleet_data:
  fleet_logs:
  prometheus_data:
  loki_data:
  promtail_positions:
  grafana_data:
